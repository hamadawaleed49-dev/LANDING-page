<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#05091C;--navy:#0A1433;--cta:#2447E0;--line:#E3E6F0;--bg:#F4F5FA;--mut:#667;--f:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select{font-family:inherit;font-size:15px}
.box{max-width:380px;margin:12vh auto;background:#fff;border-radius:16px;padding:26px;display:grid;gap:12px;box-shadow:0 4px 24px rgba(5,9,28,.08)}
input,select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
.b{background:var(--cta);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center}
.b.g{background:#E8EAF4;color:var(--ink)}.b.r{background:#FCE8E8;color:#B3261E}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{margin-inline-end:auto;font-size:18px}
header button{background:transparent;color:#cfd6f3;border:1px solid #2c3a72;border-radius:10px;padding:8px 14px;cursor:pointer}
header button.on{background:#fff;color:var(--navy);font-weight:700}
main{padding:18px;max-width:1200px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:#fff;border-radius:14px;padding:14px 16px}.st small{color:var(--mut)}.st b{display:block;font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.row input{flex:1;min-width:160px}
.panel{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bars i{display:block;background:var(--cta);border-radius:6px 6px 0 0;min-height:2px}
.tw{overflow:auto;background:#fff;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{background:#FAFBFE;color:var(--mut);font-weight:600;position:sticky;top:0}
td a{color:var(--cta);text-decoration:none}
.tag{font-size:12px;background:#EEF1FF;color:var(--cta);border-radius:999px;padding:2px 10px}
.err{color:#B3261E;font-size:14px;min-height:20px}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="box" id="login" hidden>
  <h2>تسجيل الدخول</h2>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <div class="err" id="le"></div>
  <button class="b" id="lb">دخول</button>
</div>
<div id="app" hidden>
  <header><b>لوحة التحكم</b><button data-v="orders">الأوردرات</button><button data-v="pages">الصفحات</button><button id="out">خروج</button></header>
  <main id="v"></main>
</div>
<script src="env.js"></script>
<script src="config.js"></script>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS="sbtoken",STATUS=["جديد","اتأكد","اتشحن","اتسلم","مرتجع","ملغي"];
let ORD=[],PAGES=[],view="orders",F={q:"",s:"",p:""};
const base=new URL("index.html",location.href).href;

async function auth(body,grant){
  const r=await fetch(SB.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok)throw new Error(j.error_description||j.msg||"فشل تسجيل الدخول");
  j.expires_at=Date.now()+j.expires_in*1000; localStorage.setItem(LS,JSON.stringify(j)); return j;
}
async function token(){
  let t=JSON.parse(localStorage.getItem(LS)||"null"); if(!t)return null;
  if(t.expires_at-Date.now()<60000){try{t=await auth({refresh_token:t.refresh_token},"refresh_token")}catch(e){localStorage.removeItem(LS);return null}}
  return t.access_token;
}
async function api(path,o={}){
  const t=await token(); if(!t){showLogin();throw new Error("auth")}
  const r=await fetch(SB.url+"/rest/v1/"+path,Object.assign({},o,{headers:Object.assign({apikey:SB.key,Authorization:"Bearer "+t,"Content-Type":"application/json",Prefer:"return=minimal"},o.headers||{})}));
  if(!r.ok)throw new Error(await r.text());
  const x=await r.text(); return x?JSON.parse(x):null;
}
function showLogin(){$("app").hidden=true;$("login").hidden=false}
$("lb").onclick=async()=>{
  $("le").textContent="";
  try{await auth({email:$("em").value.trim(),password:$("pw").value},"password");start()}catch(e){$("le").textContent=e.message}
};
$("out").onclick=()=>{localStorage.removeItem(LS);showLogin()};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});

async function start(){
  $("login").hidden=true;$("app").hidden=false;
  $("v").innerHTML='<div class="empty">جاري التحميل...</div>';
  try{
    ORD=await api("orders?select=*&order=created_at.desc&limit=2000");
    PAGES=await api("pages?select=slug,config,updated_at&order=updated_at.desc");
    draw();
  }catch(e){if(e.message!=="auth")$("v").innerHTML='<div class="empty">حصلت مشكلة في تحميل البيانات: '+esc(e.message)+'</div>'}
}
function draw(){
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  view==="orders"?drawOrders():drawPages();
}

/* ---------- الأوردرات ---------- */
const day=d=>new Date(d).toLocaleDateString("en-CA");
function drawOrders(){
  const today=day(Date.now()),valid=ORD.filter(o=>o.status!=="ملغي"&&o.status!=="مرتجع");
  const rev=valid.reduce((a,o)=>a+Number(o.price||0),0);
  const days=[...Array(7)].map((_,i)=>{const d=day(Date.now()-(6-i)*864e5);return[d.slice(5),ORD.filter(o=>day(o.created_at)===d).length]});
  const mx=Math.max(1,...days.map(d=>d[1]));
  const pg=[...new Set(ORD.map(o=>o.page))];
  const byPage=pg.map(p=>{const l=ORD.filter(o=>o.page===p);return `<span class="tag">${esc(p)}: ${l.length}</span>`}).join(" ");
  const list=ORD.filter(o=>(!F.s||o.status===F.s)&&(!F.p||o.page===F.p)&&(!F.q||[o.name,o.phone,o.address,o.gov].join(" ").includes(F.q)));
  $("v").innerHTML=`
  <div class="stats">
    <div class="st"><small>كل الأوردرات</small><b>${ORD.length}</b></div>
    <div class="st"><small>النهارده</small><b>${ORD.filter(o=>day(o.created_at)===today).length}</b></div>
    <div class="st"><small>جديد (محتاج تأكيد)</small><b>${ORD.filter(o=>o.status==="جديد").length}</b></div>
    <div class="st"><small>قيمة الأوردرات (من غير الملغي والمرتجع)</small><b>${rev.toLocaleString("en-US")}</b></div>
  </div>
  <div class="panel"><small style="color:var(--mut)">آخر 7 أيام</small>
    <div class="bars">${days.map(d=>`<div><i style="height:${d[1]/mx*70}px"></i>${d[1]}<br>${d[0]}</div>`).join("")}</div>
    <div style="margin-top:10px">${byPage}</div></div>
  <div class="row">
    <input id="fq" placeholder="بحث بالاسم أو الرقم أو العنوان" value="${esc(F.q)}">
    <select id="fs"><option value="">كل الحالات</option>${STATUS.map(s=>`<option${F.s===s?" selected":""}>${s}</option>`).join("")}</select>
    <select id="fp"><option value="">كل الصفحات</option>${pg.map(p=>`<option${F.p===p?" selected":""}>${esc(p)}</option>`).join("")}</select>
    <button class="b g" id="rf">تحديث</button><button class="b" id="csv">تصدير CSV</button>
  </div>
  <div class="tw">${list.length?`<table><thead><tr><th>التاريخ</th><th>الصفحة</th><th>المنتج</th><th>الاسم</th><th>الموبايل</th><th>المحافظة / العنوان</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${list.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"})}</td>
   <td><span class="tag">${esc(o.page)}</span></td>
   <td>${esc(o.product)}<br><small>${esc(o.color||"")} · ${esc(o.size||"")} · ${Number(o.price||0).toLocaleString("en-US")}</small></td>
   <td>${esc(o.name)}</td>
   <td dir="ltr"><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br><a href="https://wa.me/2${esc(o.phone)}" target="_blank" rel="noopener">واتساب</a></td>
   <td>${esc(o.gov)}<br><small>${esc(o.address)}</small></td>
   <td><select data-st="${o.id}">${STATUS.map(s=>`<option${o.status===s?" selected":""}>${s}</option>`).join("")}</select></td>
   <td><button class="b r" data-del="${o.id}">حذف</button></td></tr>`).join("")}</tbody></table>`:'<div class="empty">مفيش أوردرات لسه.</div>'}</div>`;
  $("fq").oninput=e=>{F.q=e.target.value;const p=e.target.selectionStart;drawOrders();$("fq").focus();$("fq").setSelectionRange(p,p)};
  $("fs").onchange=e=>{F.s=e.target.value;drawOrders()};
  $("fp").onchange=e=>{F.p=e.target.value;drawOrders()};
  $("rf").onclick=start;
  $("csv").onclick=()=>{
    const h=["id","created_at","page","product","color","size","price","name","phone","gov","address","status"];
    const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const t="\ufeff"+h.join(",")+"\n"+list.map(o=>h.map(k=>q(o[k])).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="orders.csv";a.click();
  };
  document.querySelectorAll("[data-st]").forEach(el=>el.onchange=async()=>{
    try{await api("orders?id=eq."+el.dataset.st,{method:"PATCH",body:JSON.stringify({status:el.value})});ORD.find(o=>o.id==el.dataset.st).status=el.value;drawOrders()}
    catch(e){alert("فشل تحديث الحالة")}
  });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm("حذف الأوردر نهائيًا؟"))return;
    try{await api("orders?id=eq."+el.dataset.del,{method:"DELETE"});ORD=ORD.filter(o=>o.id!=el.dataset.del);drawOrders()}catch(e){alert("فشل الحذف")}
  });
}

/* ---------- الصفحات ---------- */
function drawPages(){
  $("v").innerHTML=`<div class="row"><button class="b" id="np">+ صفحة جديدة</button><span style="color:var(--mut)">الصفحة الجديدة بتبدأ من إعدادات config.js وبتتعدل بعد كده من وضع التعديل.</span></div>
  <div class="tw">${PAGES.length?`<table style="min-width:640px"><thead><tr><th>المنتج</th><th>الرابط</th><th>الأوردرات</th><th></th></tr></thead><tbody>
  ${PAGES.map(p=>{const u=base+"?p="+encodeURIComponent(p.slug);return `<tr><td>${esc(p.config.productName)}<br><small>${Number(p.config.price||0).toLocaleString("en-US")} ${esc(p.config.currencySymbol||"")}</small></td>
   <td dir="ltr"><a href="${u}" target="_blank" rel="noopener">?p=${esc(p.slug)}</a></td>
   <td>${ORD.filter(o=>o.page===p.slug).length}</td>
   <td style="white-space:nowrap"><a class="b" href="${u}&edit=1" target="_blank" rel="noopener">تعديل</a>
   <button class="b g" data-cp="${esc(p.slug)}">نسخ الرابط</button>
   <button class="b g" data-dup="${esc(p.slug)}">تكرار</button>
   <button class="b r" data-rm="${esc(p.slug)}">حذف</button></td></tr>`}).join("")}</tbody></table>`:'<div class="empty">مفيش صفحات متسجلة. اضغط "صفحة جديدة".</div>'}</div>`;
  const add=async(from)=>{
    const slug=(prompt("اسم الصفحة في الرابط (إنجليزي صغير وأرقام وشرطة، مثال: hoodie-black)")||"").trim();
    if(!slug)return; if(!/^[a-z0-9-]+$/.test(slug))return alert("الاسم لازم يكون إنجليزي صغير وأرقام وشرطة بس.");
    if(PAGES.some(p=>p.slug===slug))return alert("الاسم ده موجود.");
    try{await api("pages",{method:"POST",body:JSON.stringify({slug,config:from||Object.assign({},CONFIG,{orderMode:"supabase"})})});await start();view="pages";draw()}catch(e){alert("فشل الإنشاء: "+e.message)}
  };
  $("np").onclick=()=>add();
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>add(PAGES.find(p=>p.slug===b.dataset.dup).config));
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(base+"?p="+encodeURIComponent(b.dataset.cp)).then(()=>{b.textContent="تم النسخ"}));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    if(!confirm("حذف الصفحة؟ الأوردرات القديمة هتفضل موجودة."))return;
    try{await api("pages?slug=eq."+encodeURIComponent(b.dataset.rm),{method:"DELETE"});PAGES=PAGES.filter(p=>p.slug!==b.dataset.rm);drawPages()}catch(e){alert("فشل الحذف")}
  });
}

/* ---------- تشغيل ---------- */
if(!window.SB||!SB.url){document.body.innerHTML='<div class="box"><h2>الربط ناقص</h2><p>افتح ملف env.js وحط Project URL و anon key من Supabase.</p></div>'}
else token().then(t=>t?start():showLogin());
</script>
</body>
</html>
